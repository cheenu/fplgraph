      :root {

      .legend-dot {

        height: 10px;

      }
      .position-graph {
        position: relative;
        border: 1px solid #27272a;
        background: #050505;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      circle:hover {
        stroke: #fafafa;
        stroke-width: 2.5;
      }
      .graph-tooltip {
        position: absolute;
        z-index: 2;
        max-width: 240px;
        border: 1px solid #3f3f46;
        background: #111113;
        color: #fafafa;
        padding: 6px 8px;
        pointer-events: none;
        font-size: 12px;
        line-height: 1.35;
        transform: translate(10px, -50%);
        white-space: nowrap;
      }
      .graph-tooltip[hidden] {
        display: none;
      }
    </style>

    <script>
      const graph = document.querySelector(".position-graph");
      const tooltip = document.querySelector("#graph-tooltip");

      function showTooltip(event) {
        const label = event.currentTarget.getAttribute("aria-label");

        if (!label) {
          return;
        }

        const bounds = graph.getBoundingClientRect();
        tooltip.textContent = label;
        tooltip.style.left = event.clientX - bounds.left + "px";
        tooltip.style.top = event.clientY - bounds.top + "px";
        tooltip.hidden = false;
      }

      function hideTooltip() {
        tooltip.hidden = true;
      }

      document.querySelectorAll("circle[aria-label]").forEach((circle) => {
        circle.addEventListener("mouseenter", showTooltip);
        circle.addEventListener("mousemove", showTooltip);
        circle.addEventListener("mouseleave", hideTooltip);
        circle.addEventListener("focus", (event) => {
          const label = event.currentTarget.getAttribute("aria-label");
          const bounds = graph.getBoundingClientRect();
          const pointBounds = event.currentTarget.getBoundingClientRect();

          tooltip.textContent = label;
          tooltip.style.left = pointBounds.left + pointBounds.width / 2 - bounds.left + "px";
          tooltip.style.top = pointBounds.top + pointBounds.height / 2 - bounds.top + "px";
          tooltip.hidden = !label;
        });
        circle.addEventListener("blur", hideTooltip);
      });
    </script>
